targets:
  # ==========================================================
  # AMAZON JOBS (Direct API — 100% Free, Zero Keys Needed)
  # ==========================================================

  # Amazon India: Software Development Engineer (SDE I, II, Sr)
  - id: amazon_india_sde
    type: json_api
    extractor: amazon_jobs
    url: "https://www.amazon.jobs/en/search.json?base_query=Software+Development+Engineer&country=IND&sort=recent&result_limit=15"
    alert_on: new_items
    max_items_tracked: 60

  # Amazon India: Machine Learning Engineer (MLE)
  - id: amazon_india_mle
    type: json_api
    extractor: amazon_jobs
    url: "https://www.amazon.jobs/en/search.json?base_query=Machine+Learning+Engineer&country=IND&sort=recent&result_limit=15"
    alert_on: new_items
    max_items_tracked: 60

  # Amazon Global / Remote / Abroad: Machine Learning Engineer
  - id: amazon_global_mle
    type: json_api
    extractor: amazon_jobs
    url: "https://www.amazon.jobs/en/search.json?base_query=Machine+Learning+Engineer&sort=recent&result_limit=15"
    alert_on: new_items
    max_items_tracked: 60

  # ==========================================================
  # GOOGLE, MICROSOFT, ORACLE, CAPGEMINI (Via JSearch / RapidAPI)
  # ==========================================================

  # Google, Microsoft, Oracle, Capgemini India: SDE & MLE
  - id: bigtech_india_sde_mle
    type: json_api
    extractor: jsearch
    url: "https://jsearch.p.rapidapi.com/search-v2?query=Software%20Engineer%20OR%20Machine%20Learning%20Engineer%20at%20Google%20OR%20Microsoft%20OR%20Oracle%20OR%20Capgemini%20in%20India&date_posted=3days&page=1&num_pages=1"
    headers:
      X-RapidAPI-Key: "${RAPIDAPI_KEY}"
      X-RapidAPI-Host: "jsearch.p.rapidapi.com"
    alert_on: new_items
    max_items_tracked: 60
