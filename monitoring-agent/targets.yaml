targets:
  # ==================================================================
  #  AMAZON — Direct API (India & Remote/Global)
  # ==================================================================

  # Amazon India: SDE 1
  - id: amazon_india_sde1
    type: json_api
    extractor: amazon_jobs
    fresher_only: true
    url: "https://www.amazon.jobs/en/search.json?base_query=Software+Development+Engineer+I&country=IND&sort=recent&result_limit=15"
    alert_on: new_items
    max_items_tracked: 50

  # Amazon India: Associate / Graduate Software Engineer
  - id: amazon_india_associate
    type: json_api
    extractor: amazon_jobs
    fresher_only: true
    url: "https://www.amazon.jobs/en/search.json?base_query=Associate+Software+Engineer&country=IND&sort=recent&result_limit=15"
    alert_on: new_items
    max_items_tracked: 50

  # ==================================================================
  #  INDIA — Freshers across Top Companies (Onsite + Hybrid + Remote)
  # ==================================================================

  # India: SDE 1 / Junior Software Engineer / Backend (Any company)
  - id: india_sde_entry
    type: json_api
    extractor: jsearch
    fresher_only: true
    url: "https://jsearch.p.rapidapi.com/search-v2?query=(%22Software%20Engineer%22%20OR%20%22SDE%201%22%20OR%20%22Backend%20Engineer%22)%20(%22Fresher%22%20OR%20%22Entry%20Level%22%20OR%20%22Graduate%22%20OR%20%22Junior%22%20OR%20%220-1%22)%20in%20India&date_posted=3days&page=1&num_pages=1"
    headers:
      X-RapidAPI-Key: "${RAPIDAPI_KEY}"
      X-RapidAPI-Host: "jsearch.p.rapidapi.com"
    alert_on: new_items
    max_items_tracked: 50

  # India: Python / FastAPI / Backend Developer
  - id: india_python_fastapi
    type: json_api
    extractor: jsearch
    fresher_only: true
    url: "https://jsearch.p.rapidapi.com/search-v2?query=(%22Python%20Developer%22%20OR%20%22FastAPI%22%20OR%20%22Python%20Backend%22)%20(%22Fresher%22%20OR%20%22Entry%20Level%22%20OR%20%22Junior%22%20OR%20%220-1%22)%20in%20India&date_posted=3days&page=1&num_pages=1"
    headers:
      X-RapidAPI-Key: "${RAPIDAPI_KEY}"
      X-RapidAPI-Host: "jsearch.p.rapidapi.com"
    alert_on: new_items
    max_items_tracked: 50

  # India: Machine Learning / AI / GenAI / LLM Engineer
