    fresher_only: true
    url: "https://jsearch.p.rapidapi.com/search-v2?query=(%22Machine%20Learning%20Engineer%22%20OR%20%22AI%20Engineer%22%20OR%20%22GenAI%22%20OR%20%22LLM%20Engineer%22)%20(%22Fresher%22%20OR%20%22Entry%20Level%22%20OR%20%22Junior%22)%20in%20India&date_posted=3days&page=1&num_pages=1"
    headers:
      X-RapidAPI-Key: "${RAPIDAPI_KEY}"
      X-RapidAPI-Host: "jsearch.p.rapidapi.com"
    alert_on: new_items
    max_items_tracked: 50

  # India: iOS / Swift Developer (Infosys / Apple ecosystem match)
