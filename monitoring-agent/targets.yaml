targets:
  # ==================================================================
  #  AMAZON — Direct API (India + Global)
  # ==================================================================

  # Amazon India: SDE 1
  - id: amazon_india_sde1
    type: json_api
    extractor: amazon_jobs
    fresher_only: true
    url: "https://www.amazon.jobs/en/search.json?base_query=Software+Development+Engineer+I&country=IND&sort=recent&result_limit=15"
    alert_on: new_items
    max_items_tracked: 50

  # Amazon India: Associate / Graduate Engineer
  - id: amazon_india_associate
    type: json_api
    extractor: amazon_jobs
    fresher_only: true
    url: "https://www.amazon.jobs/en/search.json?base_query=Associate+Software+Engineer&country=IND&sort=recent&result_limit=15"
    alert_on: new_items
    max_items_tracked: 50

  # Amazon Global: Entry-Level ML Engineer
  - id: amazon_global_mle1
    type: json_api
    extractor: amazon_jobs
    fresher_only: true
    url: "https://www.amazon.jobs/en/search.json?base_query=Machine+Learning+Engineer+I&sort=recent&result_limit=15"
    alert_on: new_items
    max_items_tracked: 50

  # Amazon Global: Applied Scientist I
  - id: amazon_global_appliedscientist
    type: json_api
    extractor: amazon_jobs
    fresher_only: true
    url: "https://www.amazon.jobs/en/search.json?base_query=Applied+Scientist+I&sort=recent&result_limit=15"
    alert_on: new_items
    max_items_tracked: 50

  # ==================================================================
  #  JSEARCH — INDIA (Freshers across ALL companies)
  # ==================================================================

  # India: SDE / Software Engineer / Backend / Python — Freshers
  - id: india_sde_freshers
    type: json_api
    extractor: jsearch
    fresher_only: true
    url: "https://jsearch.p.rapidapi.com/search-v2?query=(%22Software%20Engineer%22%20OR%20%22SDE%22%20OR%20%22Backend%20Engineer%22%20OR%20%22Python%20Developer%22)%20(%22Fresher%22%20OR%20%22Entry%20Level%22%20OR%20%22Graduate%22%20OR%20%22Junior%22%20OR%20%220-1%20year%22)%20in%20India&date_posted=3days&page=1&num_pages=1"
    headers:
      X-RapidAPI-Key: "${RAPIDAPI_KEY}"
      X-RapidAPI-Host: "jsearch.p.rapidapi.com"
    alert_on: new_items
    max_items_tracked: 50

  # India: ML / AI / GenAI / LLM Engineer — Freshers
  - id: india_ml_genai_freshers
    type: json_api
    extractor: jsearch
    fresher_only: true
