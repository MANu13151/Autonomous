    fresher_only: true
    url: "https://jsearch.p.rapidapi.com/search-v2?query=(%22FastAPI%22%20OR%20%22Full%20Stack%22%20OR%20%22REST%20API%22%20OR%20%22Backend%20Developer%22)%20(%22Junior%22%20OR%20%22Fresher%22%20OR%20%22Entry%20Level%22%20OR%20%22Graduate%22)%20in%20India&date_posted=3days&page=1&num_pages=1"
